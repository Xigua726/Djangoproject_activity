<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>删除活动</title>
</head>
<body>
    <h1>确定删除</h1>

    <p>确定要删除 "{{ activity.title }} 吗？"</p>
    <p>{{ activity.start_time }} - {{ activity.location }}</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">确认删除</button>
        <a href="{% url 'index' %}">取消</a>

    </form>
</body>
</html>
